<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Home LG</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #0b1020; color: #eef1ff;
               font-family: "LG Smart UI", "Segoe UI", Arial, sans-serif; overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
  .icona { width: 120px; height: 120px; border-radius: 30px; background: #ff9f5a22; display: flex; align-items: center; justify-content: center; }
  .icona svg { width: 72px; height: 72px; fill: #ff9f5a; }
  h1 { font-size: 64px; font-weight: 600; margin: 0; letter-spacing: -1px; }
  p { font-size: 32px; color: #a8b0cc; margin: 0; max-width: 1200px; line-height: 1.4; }
  .errore h1 { color: #ff6b6b; }
  code { font-size: 24px; background: #ffffff14; padding: 6px 12px; border-radius: 8px; color: #eef1ff; }
</style>
</head>
<body>
<main id="schermo">
  <div class="icona"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></div>
  <h1 id="titolo">Ripristino della Home LG…</h1>
  <p id="testo">Un attimo.</p>
</main>
<script>
'use strict';
// "Home LG": riporta Home, accensione e salvaschermo a quelli di LG e apre la Home LG.
// Funziona anche se la dashboard è stata disinstallata o non si apre.
const DASHBOARD = '/media/developer/apps/usr/palm/applications/it.casa.dashboard';
const DATI = '/var/lib/webosbrew/dashboard';
const COMANDO =
  `if [ -f ${DASHBOARD}/servizio.sh ]; then sh ${DASHBOARD}/servizio.sh ripristina; ` +
  `else mkdir -p ${DATI} && printf 'HOME_DASHBOARD=0\\nACCENSIONE=0\\nSALVASCHERMO_LG=0\\n' > ${DATI}/opzioni; fi; ` +
  `date +%s > /tmp/dashboard-salta-home; grep -q HOME_DASHBOARD=0 ${DATI}/opzioni && echo RIPRISTINATA`;

const bridgeAttivi = new Set();
function luna(uri, params) {
  return new Promise((resolve, reject) => {
    if (typeof PalmServiceBridge === 'undefined') { reject(new Error('Non in esecuzione su webOS')); return; }
    const bridge = new PalmServiceBridge();
    bridgeAttivi.add(bridge);
    const timer = setTimeout(() => { bridgeAttivi.delete(bridge); reject(new Error('Timeout')); }, 10000);
    bridge.onservicecallback = (msg) => {
      clearTimeout(timer);
      bridgeAttivi.delete(bridge);
      let res = null;
      try { res = JSON.parse(msg); } catch (e) { /* risposta non valida */ }
      if (!res || res.returnValue === false) reject(new Error((res && res.errorText) || 'Errore ' + uri));
      else resolve(res);
    };
    bridge.call(uri, JSON.stringify(params || {}));
  });
}

function mostra(titolo, testo, errore) {
  document.getElementById('titolo').textContent = titolo;
  document.getElementById('testo').innerHTML = testo;
  document.getElementById('schermo').classList.toggle('errore', !!errore);
}

async function ripristina() {
  try {
    const r = await luna('luna://org.webosbrew.hbchannel.service/exec', { command: `{ ${COMANDO}\n} </dev/null` });
    if (!/RIPRISTINATA/.test(r.stdoutString || '')) throw new Error('le opzioni non risultano cambiate');
  } catch (e) {
    mostra('Ripristino non riuscito',
      'Motivo: ' + e.message + '.<br>Dal PC: <code>./ripristina-lg.sh</code> oppure premi Home due volte di seguito.', true);
    return;
  }
  mostra('Home LG ripristinata',
    'Home, accensione e salvaschermo sono di nuovo quelli LG.<br>' +
    'Per tornare alla dashboard: apri Dashboard → Impostazioni → Avvio, Home e salvaschermo.');
  setTimeout(async () => {
    try { await luna('luna://com.webos.applicationManager/launch', { id: 'com.webos.app.home' }); } catch (e) { /* resta il messaggio */ }
    window.close();
  }, 3500);
}

// Rilanciata mentre è già aperta: rifà il ripristino
document.addEventListener('webOSRelaunch', ripristina);
ripristina();
</script>
</body>
</html>
